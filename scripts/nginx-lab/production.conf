events {}
http {
    log_format safe '$request_method $uri $status';
    access_log /dev/stdout safe;
    server {
        listen 8080;
        include /etc/nginx/snippets/auth-proxy-buffers.conf;
        # The app takes up to 200 MB per request on /api/admin/candidates (MAX_UPLOAD_REQUEST_BYTES
        # in src/lib/media/uploadSafety.mjs). nginx's own default is 1 MB and answers 413 with an
        # HTML page before the request reaches the app.
        client_max_body_size 200m;
        location / {
            proxy_pass http://web:3000;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
