services:
  fixture:
    image: node:22-alpine
    working_dir: /workspace
    command: node scripts/nginx-lab/cookie-upstream.cjs
    volumes:
      - ../../node_modules:/workspace/node_modules:ro
      - ./:/workspace/scripts/nginx-lab:ro
  nginx:
    image: nginx:stable-alpine@sha256:dc5069ad14f19660b141b21236140b91656bf89bbc3e2417c70ae650cd66104c
    depends_on:
      - fixture
    ports:
      - "127.0.0.1:8180:8080"
      - "127.0.0.1:8181:8081"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ../../deploy/nginx/auth-proxy-buffers.conf:/etc/nginx/snippets/auth-proxy-buffers.conf:ro
