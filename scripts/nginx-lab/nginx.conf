events {}
http {
    # Never log OAuth query strings, tokens, or cookies.
    log_format safe '$request_method $uri $status';
    access_log /dev/stdout safe;
    server {
        listen 8080;
        location / {
            proxy_pass http://fixture:3100;
        }
    }
    server {
        listen 8081;
        include /etc/nginx/snippets/auth-proxy-buffers.conf;
        location / {
            proxy_pass http://fixture:3100;
        }
    }
}
