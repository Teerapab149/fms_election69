version: '3'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Root deployment, mirroring production on https://ovs.fms.psu.ac.th.
        # Empty on purpose — see the base-path note in .env.
        - BASE_PATH=
        - ASSET_PREFIX=
    container_name: fms-election-web-local
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - ./public/images:/app/public/images
    depends_on:
      - db
    environment:
      # ตั้งค่า Path ที่นี่ — ว่างทั้งชุด = เสิร์ฟจาก root เหมือน production
      - BASE_PATH=
      - NEXT_PUBLIC_BASE_PATH=
      - ASSET_PREFIX=
      - NODE_ENV=production

      # URL Configuration for LOCALHOST Testing
      - NEXTAUTH_URL=http://localhost:3000
      - AUTHENTIK_REDIRECT_URI=http://localhost:3000/api/auth/authentik/callback

      # Override Database URL to point to the internal 'db' container
      # (POSTGRES_PASSWORD comes from .env — never commit a real password here)
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/fms_election?schema=public

      # Secret Keys — from .env only
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}

    # CVE revert flag removed — only the retired P0-1 admin RSA login needed it
    command: node server.js

    # Enable host networking for Windows
    extra_hosts:
      - "host.docker.internal:host-gateway"

  db:
    image: postgres:15-alpine
    container_name: fms-election-db-local
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: fms_election
    ports:
      - "5433:5432" # Host:5433 -> Container:5432 (Avoid conflict with local Postgres)
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
