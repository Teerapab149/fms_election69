# Include in the server block that proxies Next.js (also /api/auth/session).
# Keep ID token for SSO logout; allow the encrypted session's Set-Cookie chunks.
# Bounded buffers, not an unlimited header allowance. Verify real token sizes.
proxy_buffer_size 32k;
proxy_buffers 8 32k;
proxy_busy_buffers_size 64k;

# Subsequent browser requests carry the combined session chunks as Cookie.
large_client_header_buffers 4 32k;
