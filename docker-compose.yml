version: '3'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - BASE_PATH=${BASE_PATH}
        - ASSET_PREFIX=${ASSET_PREFIX}
        - NEXT_PUBLIC_ADMIN_PUBLIC_KEY=${NEXT_PUBLIC_ADMIN_PUBLIC_KEY}
        - NEXT_PUBLIC_ADMIN_AUTH_SECRET=${NEXT_PUBLIC_ADMIN_AUTH_SECRET}
    container_name: fms-election-web
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - ./public/images:/app/public/images
    environment:
      # Use variables from .env
      - BASE_PATH=${BASE_PATH}
      - NEXT_PUBLIC_BASE_PATH=${BASE_PATH}
      - ASSET_PREFIX=${ASSET_PREFIX}
      - NODE_ENV=production

      # URL Configuration
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - AUTHENTIK_REDIRECT_URI=${AUTHENTIK_REDIRECT_URI}

      # Database
      - DATABASE_URL=${DATABASE_URL}

      # Secrets
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - ADMIN_PRIVATE_KEY=${ADMIN_PRIVATE_KEY}
      - NEXT_PUBLIC_ADMIN_PUBLIC_KEY=${NEXT_PUBLIC_ADMIN_PUBLIC_KEY}
      - ADMIN_AUTH_SECRET=${ADMIN_AUTH_SECRET}
      - NEXT_PUBLIC_ADMIN_AUTH_SECRET=${NEXT_PUBLIC_ADMIN_AUTH_SECRET}
      - ADMIN_JWT_SECRET=${ADMIN_JWT_SECRET}

    command: node --security-revert=CVE-2023-46809 server.js

  db:
    image: postgres:15-alpine
    container_name: fms-election-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: teerapab1150
      POSTGRES_DB: fms_election
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data

volumes:
  postgres_data_prod:
